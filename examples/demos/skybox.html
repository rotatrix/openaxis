<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAxis — SO3 Skybox</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OpenAxisClient, NavigationSession, UNAVAILABLE } from "../../ts/sdk/src/index.js";
    import { manageFocus } from "./lib/focus-manager.js";
    import { createStatusHUD } from "./lib/status-hud.js";

    import { Quat } from "../../ts/sdk/src/geometry/index.js";
    const threeQuatToRotvec = q => new Quat(q.w, q.x, q.y, q.z).toRotvec();
    const rotvecToThreeQuat = r => {
      const q = Quat.fromRotvec(...r);
      return new THREE.Quaternion(q.x, q.y, q.z, q.w);
    };



    // --- Scene setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- Procedural gradient sky texture ---
    function makeSkyTexture() {
      const size = 1024;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const ctx = c.getContext("2d");

      // Vertical gradient: deep blue at top, warm orange at horizon, dark at bottom
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0.0, "#0a0a30");
      grad.addColorStop(0.25, "#1a2a6c");
      grad.addColorStop(0.45, "#b21f1f");
      grad.addColorStop(0.55, "#fdbb2d");
      grad.addColorStop(0.7, "#1a2a6c");
      grad.addColorStop(1.0, "#0a0a30");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // Scatter some stars in the upper portion
      ctx.fillStyle = "#fff";
      for (let i = 0; i < 200; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size * 0.35;
        const r = Math.random() * 1.5 + 0.5;
        ctx.globalAlpha = Math.random() * 0.7 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      // Stars in the lower portion too
      for (let i = 0; i < 200; i++) {
        const x = Math.random() * size;
        const y = size * 0.65 + Math.random() * size * 0.35;
        const r = Math.random() * 1.5 + 0.5;
        ctx.globalAlpha = Math.random() * 0.7 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // --- Inverted sphere as skybox ---
    const skyGeo = new THREE.SphereGeometry(50, 64, 32);
    const skyMat = new THREE.MeshBasicMaterial({
      map: makeSkyTexture(),
      side: THREE.BackSide,
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // One camera, one writer: answer scene queries and apply rotations.
    let alive = true, stopping, animationFrame;
    const updateHUD = createStatusHUD();
    const client = new OpenAxisClient({ clientName: "demo-skybox" });
    const cameraPose = () => ({ t: [0, 0, 0], r: threeQuatToRotvec(camera.quaternion), fov: camera.fov * Math.PI / 180 });
    const adapter = {
      captureContext: () => alive ? camera : undefined,
      isCurrent: context => alive && context === camera,
      beginQuery() {
        const pose = cameraPose();
        return { resolve(name) {
          switch (name) {
            case "document.id": return "demo-skybox";
            case "world.orientation": return { forward: [0, 0, -1], up: [0, 1, 0], handedness: "right" };
            case "camera.pose": return pose;
            case "viewport.aspect": return camera.aspect;
            case "navigation.preferences": return { lock_roll: false, lock_translation_plane: false };
            default: return UNAVAILABLE;
          }
        } };
      },
      applyPose(context, pose) {
        camera.quaternion.copy(rotvecToThreeQuat(pose.r));
        // Skybox is rotation-only with fixed perspective: report what was
        // actually applied, including the unchanged position and FOV.
        return { success: true, realizedPose: cameraPose() };
      },
    };
    const session = new NavigationSession(client, adapter);
    const cancelGesture = () => session.contextChanged();
    const fm = manageFocus(client, {
      metadata: () => ({ tags: ["demo-skybox"], capabilities: ["navigation"] }),
      onState: updateHUD,
      onPauseChange(paused) { updateHUD.setPaused(paused); if (paused) cancelGesture(); },
    });
    const onKey = e => { if (e.key === "Escape") fm.isPaused() ? fm.resume() : fm.pause(); };
    const onClick = () => fm.resume();
    const onResize = () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
    };
    const onPageHide = event => {
      if (event.persisted) cancelGesture();
      else void shutdown().catch(error => console.error("Skybox shutdown failed", error));
    };
    addEventListener("keydown", onKey); addEventListener("blur", cancelGesture);
    addEventListener("resize", onResize); addEventListener("pagehide", onPageHide);
    renderer.domElement.addEventListener("click", onClick);
    function shutdown() {
      if (stopping) return stopping;
      alive = false; cancelAnimationFrame(animationFrame);
      removeEventListener("keydown", onKey); removeEventListener("blur", cancelGesture);
      removeEventListener("resize", onResize); removeEventListener("pagehide", onPageHide);
      renderer.domElement.removeEventListener("click", onClick);
      stopping = (async () => {
        try { await fm.destroy(); }
        finally {
          session.close(); session.drain();
          skyGeo.dispose(); skyMat.map.dispose(); skyMat.dispose();
          renderer.dispose();
        }
      })();
      return stopping;
    }
    function animate() {
      if (!alive) return;
      animationFrame = requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
