name: SDK packages

on:
  push:
    branches: [master]
    tags: ['py/v*', 'ts/v*', 'cs/v*', 'cpp/v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: SDK to build and check
        required: true
        type: choice
        options: [python, typescript, csharp, cpp]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'rotatrix/openaxis'
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      package: ${{ steps.select.outputs.package }}
      release: ${{ steps.select.outputs.release }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: select
        env:
          REQUESTED_PACKAGE: ${{ inputs.package }}
        with:
          script: |
            const packages = {py: 'python', ts: 'typescript', cs: 'csharp', cpp: 'cpp'};
            const isRelease = context.eventName === 'push' && context.ref.startsWith('refs/tags/') && !context.payload.deleted;
            let selected = ['python', 'typescript', 'csharp', 'cpp'];
            if (isRelease) {
              const match = /^refs\/tags\/(py|ts|cs|cpp)\/v([0-9][0-9A-Za-z.+-]*)$/.exec(context.ref);
              if (!match) throw new Error('Invalid package release tag');
              selected = [packages[match[1]]];
            } else if (context.eventName === 'workflow_dispatch') {
              if (!Object.values(packages).includes(process.env.REQUESTED_PACKAGE)) throw new Error('Invalid package');
              selected = [process.env.REQUESTED_PACKAGE];
            }
            core.setOutput('packages', JSON.stringify(selected));
            core.setOutput('package', isRelease ? selected[0] : '');
            core.setOutput('release', String(isRelease));

  build:
    name: Check ${{ matrix.package }} package
    needs: select
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    runs-on: ${{ matrix.package == 'csharp' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    outputs:
      # A release tag selects exactly one package, so release outputs are unambiguous.
      package-name: ${{ steps.metadata.outputs.package-name }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate tag, source version, and public master ancestry
        if: needs.select.outputs.release == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          python scripts/package-release.py validate-tag --package "$PACKAGE"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.15'
          enable-cache: false
      - if: matrix.package == 'typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - if: matrix.package == 'typescript'
        run: corepack enable
      - if: matrix.package == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            9.0.314
            8.0.x
      - name: Test packaging checks
        run: python scripts/test_package_release.py
      - name: Build package archives
        shell: bash
        run: python scripts/package-release.py prepare --package "$PACKAGE"
      - name: Check clean consumer installs
        shell: bash
        run: python scripts/package-release.py check --package "$PACKAGE"
      - name: Python SDK tests
        if: matrix.package == 'python'
        run: uv run --no-project --with pytest --with ./py/openaxis python -m pytest -c py/openaxis/pyproject.toml py/openaxis/tests
      - name: TypeScript SDK tests
        if: matrix.package == 'typescript'
        run: pnpm -C ts/sdk test
      - name: C# SDK tests
        if: matrix.package == 'csharp'
        run: dotnet run --project cs/OpenAxis.ConformanceTests -c Release
      - name: Record release identity
        id: metadata
        shell: bash
        run: python scripts/package-release.py metadata --package "$PACKAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: package-${{ matrix.package }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/packages/${{ github.sha }}/${{ matrix.package }}/manifest.json
            build/packages/${{ github.sha }}/${{ matrix.package }}/${{ matrix.package }}/*

  publish:
    name: Publish ${{ needs.build.outputs.package-name }} ${{ needs.build.outputs.version }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.select.outputs.release == 'true'
    needs: [select, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: publish-${{ needs.select.outputs.package }}
    env:
      PACKAGE: ${{ needs.select.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Deliberately no checkout, dependency installation, or package build here.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - name: Verify artifact identity and checksums
        id: verify
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('artifacts').resolve()
          manifest = json.loads((root / 'manifest.json').read_text())
          package = os.environ['PACKAGE']
          assert manifest['public_commit'] == os.environ['GITHUB_SHA'], 'Wrong source commit'
          assert manifest.get('dirty') is False, 'Artifacts must come from a clean checkout'
          assert set(manifest['packages']) == {package}, 'Wrong package selection'
          item = manifest['packages'][package]
          assert item['checked'] is True, 'Local installation checks did not pass'
          assert item['version'] == os.environ['VERSION'], 'Wrong version'
          prefixes = {'python': 'py', 'typescript': 'ts', 'csharp': 'cs', 'cpp': 'cpp'}
          assert os.environ['GITHUB_REF'] == 'refs/tags/' + prefixes[package] + '/v' + item['version'], 'Wrong release tag'
          assert re.fullmatch(r'[0-9][0-9A-Za-z.+-]*', item['version']), 'Invalid version'
          files = []
          for name, digest in item['files'].items():
              path = (root / name).resolve()
              assert path.is_relative_to(root) and path.parent == root / package, 'Invalid artifact path'
              assert re.fullmatch(r'[A-Za-z0-9_.+-]+', path.name), 'Invalid artifact filename'
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Artifact changed'
              files.append(path)
          assert set(p for p in root.rglob('*') if p.is_file()) == set(files) | {root / 'manifest.json'}
          if package == 'python':
              assert len(files) == 2 and sum(p.suffix == '.whl' for p in files) == 1
              assert sum(p.name.endswith('.tar.gz') for p in files) == 1
          elif package == 'cpp':
              assert len(files) == 1 and files[0].name == 'openaxis-cpp-' + item['version'] + '.tar.gz'
          else:
              assert len(files) == 1
              assert files[0].name.endswith('.tgz' if package == 'typescript' else '.nupkg')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('file=' + str(files[0]) + '\n')
              output.write('npm-tag=' + ('next' if '-' in item['version'] else 'latest') + '\n')
          PY
      - name: Reject a moved candidate tag before publication
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const {data: ref} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            let object = ref.object;
            while (object.type === 'tag') {
              const {data} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha});
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Candidate tag moved; cancel this run and use the new tag run');
            }
      - name: Publish to PyPI with trusted publishing and attestations
        if: env.PACKAGE == 'python'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifacts/python/
          attestations: true
      - if: env.PACKAGE == 'typescript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - name: Publish to npm with OIDC and provenance
        if: env.PACKAGE == 'typescript'
        env:
          PACKAGE_FILE: ${{ steps.verify.outputs.file }}
          DIST_TAG: ${{ steps.verify.outputs.npm-tag }}
        # npm CLI is required for its native OIDC flow; builds/installations use pnpm.
        run: npm publish "$PACKAGE_FILE" --registry https://registry.npmjs.org/ --access public --tag "$DIST_TAG" --provenance --ignore-scripts
      - if: env.PACKAGE == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.314'
      - name: Exchange GitHub identity for a short-lived NuGet key
        if: env.PACKAGE == 'csharp'
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        if: env.PACKAGE == 'csharp'
        env:
          PACKAGE_FILE: ${{ steps.verify.outputs.file }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$PACKAGE_FILE" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"

  release:
    name: Record ${{ needs.build.outputs.tag }} on GitHub
    needs: [select, build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: artifacts
      - name: Create GitHub Release after successful publication
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PACKAGE: ${{ needs.select.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^(py|ts|cs|cpp)\/v[0-9][0-9A-Za-z.+-]*$/.test(tag) || context.ref !== `refs/tags/${tag}`) {
              throw new Error('Invalid release tag');
            }
            // Never create or move a tag. Resolve annotated tags to the source commit.
            let { data: ref } = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            let object = ref.object;
            while (object.type === 'tag') {
              const {data} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha});
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) throw new Error('Release tag moved');
            const fs = require('fs');
            const crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync('artifacts/manifest.json', 'utf8'));
            const item = manifest.packages[process.env.PACKAGE];
            if (manifest.public_commit !== context.sha || item.version !== process.env.VERSION || !item.checked) throw new Error('Wrong release artifact');
            const files = Object.entries(item.files).map(([name, digest]) => {
              if (!/^(python|typescript|csharp|cpp)\/[A-Za-z0-9_.+-]+$/.test(name)) throw new Error('Invalid artifact path');
              const data = fs.readFileSync(`artifacts/${name}`);
              if (crypto.createHash('sha256').update(data).digest('hex') !== digest) throw new Error('Artifact changed');
              return {name: name.split('/')[1], data, digest};
            });
            const body = [`Package: ${process.env.PACKAGE} ${item.version}`, `Source commit: ${context.sha}`, '',
              'See the SDK documentation at https://openaxis.rotatrix.com/.', '',
              ...files.map(f => `- ${f.name}: SHA-256 \`${f.digest}\``)].join('\n');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({...context.repo, tag}));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({...context.repo, tag_name: tag,
                name: tag, body, prerelease: !/^\d+\.\d+\.\d+$/.test(item.version), make_latest: 'false'}));
            }
            if (process.env.PACKAGE === 'cpp') {
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id});
              for (const file of files) {
                const existing = assets.find(a => a.name === file.name);
                if (existing) {
                  if (existing.digest !== `sha256:${file.digest}`) throw new Error('Existing source asset differs');
                  continue;
                }
                await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id,
                  name: file.name, data: file.data, headers: {'content-type': 'application/gzip'}});
              }
            }
