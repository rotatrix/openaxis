<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Normalized viewport coordinates</title><desc id="desc">Viewport center is zero zero, bottom-left minus one minus one and top-right one one. Positive X goes right and positive Y goes up, independent of the world basis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="320" rx="8" fill="#fff"/><g font-family="system-ui,sans-serif" font-size="17" fill="#17212b">
<text x="28" y="32" font-weight="600">Viewport space · normalized cursor coordinates</text>
<rect x="125" y="67" width="440" height="198" fill="#f8fafc" stroke="#94a3b8"/>
<g stroke="#94a3b8" stroke-dasharray="4 4"><path d="M125 166H565"/><path d="M345 67V265"/></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M345 166H529"/><path d="M345 166V91"/></g>
<circle cx="345" cy="166" r="4" fill="#17212b"/><text x="355" y="192">(0, 0)</text><text x="489" y="153">+X</text><text x="356" y="109">+Y</text>
<text x="125" y="57">(−1, +1)</text><text x="565" y="57" text-anchor="end">(+1, +1)</text><text x="125" y="288">(−1, −1)</text><text x="565" y="288" text-anchor="end">(+1, −1)</text><text x="345" y="310" font-size="14" text-anchor="middle">Use the drawable viewport; exclude toolbars and window borders.</text></g></svg>