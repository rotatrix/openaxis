<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Camera-local axes</title><desc id="desc">Illustrative right-handed camera basis. Right, up and backward are local axes; forward is opposite backward. The camera pose orients this basis in the application world.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="320" rx="8" fill="#fff"/><g font-family="system-ui,sans-serif" font-size="17" fill="#17212b">
<text x="28" y="32" font-weight="600">Camera-local space · right-handed example</text>
<g fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M300 173H507" stroke="#b42318"/><path d="M300 173V64" stroke="#15803d"/><path d="M300 173L162 264" stroke="#2563eb"/><path d="M300 173L438 82" stroke="#475569" stroke-dasharray="5 5"/></g>
<circle cx="300" cy="173" r="6" fill="#17212b"/><text x="519" y="178">Right (+X)</text><text x="268" y="53">Up (+Y)</text><text x="30" y="285">Backward (+Z)</text><text x="450" y="78">Forward (−Z)</text><text x="320" y="210">Camera origin</text>
<text x="270" y="266" font-size="15">The pose rotates these axes into world space.</text><text x="270" y="291" font-size="15">For left-handed worlds, see the right-axis reflection below.</text></g></svg>