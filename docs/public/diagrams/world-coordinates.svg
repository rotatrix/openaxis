<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Application world coordinates</title><desc id="desc">An illustrative Z-up world. The camera and geometry have positions relative to the same world origin. Your application declares its own orientation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="720" height="320" rx="8" fill="#fff"/><g font-family="system-ui,sans-serif" font-size="17" fill="#17212b">
<text x="28" y="32" font-weight="600">World space · an illustrative Z-up world</text>
<g fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M160 222H345" stroke="#b42318"/><path d="M160 222V67" stroke="#2563eb"/><path d="M160 222L260 140" stroke="#15803d"/></g>
<text x="355" y="229">+X</text><text x="146" y="57">+Z</text><text x="267" y="135">+Y</text><text x="174" y="248">World origin</text>
<path d="M160 222L462 109" stroke="#64748b" stroke-dasharray="5 5"/><rect x="442" y="75" width="70" height="52" rx="5" fill="#eef2f6" stroke="#64748b"/><text x="530" y="98">Camera</text><text x="530" y="121">position t</text>
<path d="M365 160l45 -20 45 20 -45 20z M365 160v45l45 20 45 -20v-45 M410 180v45" fill="#e0e7ff" stroke="#64748b"/><text x="480" y="201">Scene geometry</text>
<text x="270" y="278" font-size="15">Positions, bounds and pivots share scene units.</text><text x="270" y="302" font-size="15">Declare your world's basis with world.orientation.</text></g></svg>