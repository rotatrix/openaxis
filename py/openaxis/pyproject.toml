[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openaxis"
dynamic = ["version"]
description = "Python client SDK for the OpenAxis input protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0 OR GPL-3.0-only"
license-files = ["LICENSE", "LEGAL.md"]
authors = [{ name = "Icebound Flame LLC", email = "david@rotatrix.com" }]
dependencies = [
    "ecdsa>=0.19.1,<1",
    "msgpack>=1.0",
    "websockets>=13.0",
]

[project.urls]
Documentation = "https://openaxis.rotatrix.com/"
Repository = "https://github.com/rotatrix/openaxis"

[tool.hatch.build.targets.wheel]
packages = ["src/openaxis"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests"]

[tool.hatch.version]
path = "src/openaxis/_version.py"
